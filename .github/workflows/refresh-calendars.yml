name: Refresh Calendars

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:       # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch calendar feeds
        run: |
          mkdir -p feeds
          curl -L --max-time 15 "https://p127-caldav.icloud.com/published/2/NTcxMTY4NTQ4NTcxMTY4NUwc29ymuumPBBLSLt2tLutpgn3SIKQqSpD9hidKI2ud" -o feeds/kooi-family.ics
          curl -L --max-time 15 "https://p127-caldav.icloud.com/published/2/NTcxMTY4NTQ4NTcxMTY4NUwc29ymuumPBBLSLt2tLutqLKSt5Bzb6nhqLwHKvCAj_9vavH1LcgDvs6lFwmX4pT2mAJu2lj7LHEW8CT4rbqA" -o feeds/kooi-ohio.ics
          curl -L --max-time 15 "https://calendar.playmetrics.com/calendars/c610/t359149/p0/t08BC233F/f/calendar.ics" -o feeds/drem-soccer.ics
          curl -L --max-time 15 "https://www.nextvolleyballclub.com/ical_feed?tags=8318994" -o feeds/sofie-volleyball.ics

      - name: Commit updated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/
          git diff --staged --quiet || git commit -m "Refresh calendar feeds"
          git push
