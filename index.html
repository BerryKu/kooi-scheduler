<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kooi Family — Schedule Time Together</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:           #1E1E1E;
      --surface:      #FFFFFF;
      --text:         #1A2B19;
      --text-soft:    #757575;
      --orange:        #F36C21;
      --orange-hover:  #C4540F;
      --orange-light:  #F99152;
      --orange-pale:   #FFFFFF;
      --busy:         #E4E4E4;
      --past:         #EBEBEB;
      --border:       #D8D8D8;
      --shadow:       0 4px 24px rgba(0,0,0,0.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    header { padding: 2.5rem 1.5rem 1.5rem; text-align: center; }
    .eyebrow { font-size: .72rem; letter-spacing: .15em; text-transform: uppercase; color: var(--orange-light); font-weight: 500; margin-bottom: .4rem; }
    h1 { font-family: 'Outfit', sans-serif; font-size: clamp(1.8rem,4vw,2.6rem); font-weight: 600; color: var(--orange); }
    .subtitle { font-size: .9rem; color: var(--text-soft); margin-top: .4rem; font-weight: 300; }

    .week-nav { display: flex; align-items: center; justify-content: center; gap: 1rem; padding: 1rem 1.5rem .5rem; }
    .nav-btn { background: #DBEAFE; border: 1px solid #93C5FD; border-radius: 8px; padding: .45rem 1.1rem; cursor: pointer; font-family: 'Outfit', sans-serif; font-size: .82rem; font-weight: 500; color: #1E40AF; transition: background .15s; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    .nav-btn:hover { background: #BFDBFE; border-color: #60A5FA; }
    .today-btn { background: #FDE8D8; border-color: #F99152; color: #C4540F; }
    .today-btn:hover { background: #FBCFAA; border-color: var(--orange); }
    .week-label { font-size: .9rem; font-weight: 600; min-width: 220px; text-align: center; color: #FFFFFF; }

    .status-bar { text-align: center; font-size: .78rem; color: #9A9A9A; padding: .4rem 1rem .8rem; min-height: 2rem; }
    .status-bar.error { color: #c0392b; }

    .grid-wrapper { overflow-x: auto; padding: 0 1rem 2rem; -webkit-overflow-scrolling: touch; }
    .grid {
      display: grid;
      grid-template-columns: 52px repeat(14, 1fr); /* overridden by JS */
      min-width: 900px; max-width: 1400px;
      margin: 0 auto;
      border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
      background: var(--surface); box-shadow: var(--shadow);
    }
    .col-header { padding: .6rem .3rem; text-align: center; background: var(--surface); border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); font-size: .72rem; font-weight: 600; color: var(--text-soft); text-transform: uppercase; letter-spacing: .06em; line-height: 1.5; }
    .col-header.today { color: var(--orange); background: #FDE8D8; }
    .col-header.corner { border-right: 1px solid var(--border); }

    .time-label { padding: 0 .5rem; display: flex; align-items: center; justify-content: flex-end; font-size: .65rem; color: var(--text-soft); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--surface); white-space: nowrap; user-select: none; }
    .time-label.half { border-bottom-style: solid; border-bottom-color: #AAAAAA; }
    .time-label:not(.half) { border-bottom-style: dashed; border-bottom-color: #CCCCCC; }

    .cell { height: 22px; border-right: 1px solid var(--border); border-bottom: 1px dashed #CCCCCC; transition: background .1s; }
    button.cell { appearance: none; -webkit-appearance: none; box-sizing: border-box; height: 22px; padding: 0; margin: 0; border-radius: 0; border-right: 1px solid var(--border); border-bottom: 1px dashed #CCCCCC; border-top: none; border-left: none; display: block; width: 100%; cursor: pointer; background: none; font: inherit; color: inherit; outline: none; }
    .cell:last-child { border-right: none; }
    .cell.half-hour { border-bottom-color: #AAAAAA; border-bottom-style: solid; }
    .cell.available { background: var(--orange-pale); cursor: pointer; position: relative; }
    .cell.available:hover { background: var(--orange); }
    .cell.available:hover::after { content: attr(data-time); position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 9px; font-weight: 600; color: #FFFFFF; white-space: nowrap; pointer-events: none; font-family: 'Outfit',sans-serif; display: none; }
    .cell.busy    { background: var(--busy); cursor: default; }
    .cell.past    { background: var(--past); opacity: .55; cursor: default; }
    .cell.loading { background: linear-gradient(90deg,#EEEAE5 25%,#F5F2EE 50%,#EEEAE5 75%); background-size: 300% 100%; animation: shimmer 1.6s infinite linear; }

    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    .legend { display: flex; gap: 1.2rem; justify-content: center; flex-wrap: wrap; padding: .75rem 1rem 1.5rem; font-size: .78rem; color: #9A9A9A; font-weight: 300; }
    .legend-item { display: flex; align-items: center; gap: .4rem; }
    .legend-swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.08); }

    /* Modal */
    .overlay { position: fixed; inset: 0; background: rgba(20,35,20,.45); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; z-index: 200; padding: 1rem; }
    .overlay.open { display: flex; }
    .modal { background: var(--surface); border-radius: 18px; padding: 2rem; width: 100%; max-width: 400px; box-shadow: 0 24px 72px rgba(0,0,0,.18); animation: slideUp .2s ease; }
    @keyframes slideUp { from{transform:translateY(16px);opacity:0} to{transform:translateY(0);opacity:1} }
    .modal-eyebrow { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--orange-light); font-weight: 600; margin-bottom: .3rem; }
    .modal h2 { font-family: 'Outfit', sans-serif; font-size: 1.45rem; font-weight: 600; color: var(--orange); line-height: 1.25; margin-bottom: .25rem; }
    .modal-divider { border: none; border-top: 1px solid var(--border); margin: 0 0 .5rem; }
    .slot-display { font-family: 'Outfit', sans-serif; font-size: .9rem; color: #1A1A1A; line-height: 1.5; padding: .2rem 0 .8rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: .72rem; font-weight: 600; color: var(--text-soft); text-transform: uppercase; letter-spacing: .08em; margin-bottom: .35rem; }
    .field input, .field select { width: 100%; padding: .62rem .85rem; border: 1px solid #D8D8D8 !important; border-radius: 9px; font-family: 'Outfit', sans-serif; font-size: .9rem; color: #1A1A1A !important; background: #FFFFFF !important; -webkit-appearance: none; -webkit-text-fill-color: #1A1A1A !important; }
    .field input::placeholder { color: #B0B0B0; opacity: 1; }
    .field input::-webkit-input-placeholder { color: #B0B0B0; }
    .field input::-moz-placeholder { color: #B0B0B0; }
    .field input { color: #B0B0B0 !important; -webkit-text-fill-color: #B0B0B0 !important; }
    .field input.has-value { color: #1A1A1A !important; -webkit-text-fill-color: #1A1A1A !important; }
    .field input:focus, .field select:focus { outline: none; border-color: var(--orange) !important; }
    .field input:-webkit-autofill, .field input:-webkit-autofill:hover, .field input:-webkit-autofill:focus { -webkit-box-shadow: 0 0 0px 1000px #FFFFFF inset !important; -webkit-text-fill-color: #1A1A1A !important; }
    .modal-actions { display: flex; gap: .75rem; margin-top: 1.5rem; }
    .btn-cancel { padding: .72rem 1.2rem; background: none; border: 1px solid var(--border); border-radius: 9px; font-family: 'Outfit', sans-serif; font-size: .88rem; color: var(--text-soft); cursor: pointer; }
    .btn-cancel:hover { background: var(--bg); }
    .btn-download { flex: 1; padding: .72rem; background: var(--orange); color: white; border: none; border-radius: 9px; font-family: 'Outfit', sans-serif; font-size: .88rem; font-weight: 600; cursor: pointer; }
    .btn-download:hover { background: var(--orange-hover); }
    .download-note { font-size: .72rem; color: var(--text-soft); text-align: center; margin-top: .75rem; font-weight: 300; }

    /* ── MOBILE ── */
    @media (max-width: 767px) {
      .grid {
        min-width: unset !important;
        max-width: 100% !important;
        width: 100% !important;
      }
      .grid-wrap { padding: 0 .4rem .75rem; overflow-x: hidden; }
      .col-hdr { font-size: .58rem; padding: .35rem .1rem; letter-spacing: 0; }
      .tlabel { font-size: .55rem; padding: 0 .2rem; }
      .time-label { height: 28px; font-size: .55rem; }
      #calGrid { grid-template-columns: 52px repeat(7, 1fr) !important; }
      .cell { height: 28px; }
      button.cell { box-sizing: border-box; height: 28px; }
      .week-nav { gap: .4rem; flex-wrap: wrap; }
      .nav-btn { padding: .35rem .6rem; font-size: .75rem; }
      .week-label { font-size: .78rem; min-width: unset; width: 100%; order: -1; text-align: center; }
      h1 { font-size: 1.4rem; }
      .subtitle { font-size: .78rem; }
      .header { padding: 1rem .75rem .75rem; }
      .modal { padding: 1.25rem; width: 95%; }
    }

    .cell.selecting { background: rgba(243,108,33,0.35) !important; }
    .cell.tap-start  { background: var(--orange) !important; }

  </style>
</head>
<body>

<header>
  <p class="eyebrow">Family Availability</p>
  <h1>Kooi Family</h1>
  <p class="subtitle">Choose an open time to schedule a get-together</p>
</header>

<div class="week-nav">
  <button class="nav-btn" onclick="changeWeek(-1)">&#8592; Last Week</button>
  <div class="week-label" id="weekLabel"></div>
  <button class="nav-btn today-btn" onclick="goToToday()">Today</button>
  <button class="nav-btn" onclick="changeWeek(1)">Next Week &#8594;</button>
</div>
<p class="status-bar" id="statusBar">Loading calendars&hellip;</p>

<div class="grid-wrapper">
  <div class="grid" id="calGrid"></div>
</div>


<div class="legend">
  <div class="legend-item"><div class="legend-swatch" style="background:var(--orange-pale)"></div> Available — click to schedule</div>
  <div class="legend-item"><div class="legend-swatch" style="background:var(--busy)"></div> Busy</div>
</div>

<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal">
    <p class="modal-eyebrow">Schedule a Get-Together</p>
    <h2>Time with the Kooi Family</h2>
    <hr class="modal-divider">
    <div class="slot-display" id="slotDisplay"></div>
    <div class="field">
      <label>Your Name / Family</label>
      <input type="text" id="guestName" placeholder="e.g. The Simpsons">
    </div>
    <div class="field">
      <label>Location</label>
      <input type="text" id="locationField" placeholder="e.g. 742 Evergreen Terrace">
    </div>
    <div class="field">
      <label>Your Email</label>
      <input type="email" id="guestEmail" placeholder="e.g. Homer@simpsons.com">
    </div>
    <div class="field">
      <label>Note (optional)</label>
      <input type="text" id="noteField" placeholder="e.g. Backyard cookout, kids welcome">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-download" onclick="downloadInvite()">Send Invite</button>
    </div>
    <p class="download-note">Sends a calendar invite to you and the Kooi family</p>
  </div>
</div>

<script>
// ── CONFIG ─────────────────────────────────────────────────────────────────
const FAMILY_NAME  = 'Kooi Family';

const FEED_NAMES = ['kooi-family', 'kooi-ohio', 'drem-soccer', 'bwi-families', 'bwms-families', 'kooi-social'];
const FEED_LABELS = {
  'kooi-family':   'Kooi Family',
  'kooi-ohio':     'Kooi Ohio',
  'drem-soccer':   'Drem Soccer',
  'bwi-families':  'BWI Families',
  'bwms-families': 'BWMS Families',
  'kooi-social':   'Kooi Social',
};

// ── EMAIL CONFIG ───────────────────────────────────────────────────────────
// Paste your Google Apps Script web app URL here after deploying
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyMSvVKQdj3BkCW2HuGcW0IVo4IA73zwecpXgkkVL01C98ezMZ181uSveZqbqiRJmlJMg/exec';
const KOOI_EMAIL        = 'bernieandlizkooi@gmail.com';
const SCRIPT_TOKEN      = 'kooi2026scheduler';
const MINS_START   = 10 * 60;   // 10:00 AM
const MINS_END     = 22 * 60;   // 10:00 PM
const SCHOOL_START = 8  * 60;   // block from 8 AM
const SCHOOL_END   = 16 * 60;   // block until 4 PM



// ── SCHOOL CALENDAR ────────────────────────────────────────────────────────
// Big Walnut Local Schools 2025-26 and 2026-27
const SCHOOL_YEARS = [
  { start: new Date(2025,7,13), end: new Date(2026,4,21) },
  { start: new Date(2026,7,20), end: new Date(2027,4,27) },
];

// All non-weekend no-school dates (holidays, breaks, teacher workdays)
const NO_SCHOOL = new Set([
  // 2025-2026
  '2025-9-1',                                          // Labor Day
  '2025-9-15',                                         // Prof Dev / Fair Day
  '2025-10-17',                                        // Conf comp day
  '2025-11-26','2025-11-27','2025-11-28',              // Thanksgiving break
  '2025-12-1',                                         // Prof Dev Day
  '2025-12-22','2025-12-23','2025-12-24','2025-12-25', // Winter break
  '2025-12-26','2025-12-29','2025-12-30','2025-12-31',
  '2026-1-1','2026-1-2',                               // Winter break cont.
  '2026-1-19',                                         // MLK Day
  '2026-2-16',                                         // Presidents Day
  '2026-3-30','2026-3-31','2026-4-1','2026-4-2','2026-4-3', // Spring break
  '2026-4-6',                                          // Conf comp day
  // 2026-2027
  '2026-9-7',                                          // Labor Day
  '2026-9-21',                                         // Prof Dev Day
  '2026-10-16',                                        // Teacher workday
  '2026-11-25','2026-11-26','2026-11-27',              // Thanksgiving
  '2026-11-30',                                        // Prof Dev Day
  '2026-12-21','2026-12-22','2026-12-23','2026-12-24', // Winter break
  '2026-12-25','2026-12-28','2026-12-29','2026-12-30','2026-12-31',
  '2027-1-1','2027-1-2','2027-1-4',                   // Winter break cont.
  '2027-1-18',                                         // MLK Day
  '2027-2-15',                                         // Presidents Day
  '2027-3-26',                                         // Conf exchange day
  '2027-3-29','2027-3-30','2027-3-31','2027-4-1','2027-4-2', // Spring break
]);

function isSchoolDay(date) {
  const dow = date.getDay();
  if (dow === 0 || dow === 6) return false;
  const d0 = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const inYear = SCHOOL_YEARS.some(yr => d0 >= yr.start && d0 <= yr.end);
  if (!inYear) return false;
  const key = `${date.getFullYear()}-${date.getMonth()+1}-${date.getDate()}`;
  return !NO_SCHOOL.has(key);
}

// ── STATE ──────────────────────────────────────────────────────────────────
let weekOffset   = 0;
let allEvents    = [];
let loading      = true;
let selectedSlot = null; // { date, mins }

// ── DATE PARSER (for server-side free/busy slots) ─────────────────────────
function parseICSDate(val) {
  if (!val) return null;
  val = val.trim();
  // All-day: YYYYMMDD
  if (/^\d{8}$/.test(val)) return new Date(+val.slice(0,4), +val.slice(4,6)-1, +val.slice(6,8));
  // DateTime
  const d = val.replace(/[TZ]/g,'');
  const y=+d.slice(0,4), mo=+d.slice(4,6)-1, dy=+d.slice(6,8);
  const h=d.length>=10?+d.slice(8,10):0, mi=d.length>=12?+d.slice(10,12):0;
  if (val.endsWith('Z')) return new Date(Date.UTC(y,mo,dy,h,mi,0));
  return new Date(y,mo,dy,h,mi,0);
}

// ── ICS PARSER ────────────────────────────────────────────────────────────
function parseICS(raw) {
  const text = raw.replace(/\r\n[ \t]/g,'').replace(/\r\n|\r|\n/g,'\n').replace(/\n[ \t]/g,'\n');
  const lines = text.split('\n');
  const events = [];
  let inEvent = false, ev = {};
  for (const line of lines) {
    const l = line.trim();
    if (l === 'BEGIN:VEVENT')  { inEvent = true; ev = {}; continue; }
    if (l === 'END:VEVENT')    { inEvent = false; if (ev.start) events.push(ev); continue; }
    if (!inEvent) continue;
    const sep = l.indexOf(':');
    if (sep < 0) continue;
    const key = l.slice(0, sep).toUpperCase();
    const val = l.slice(sep + 1);
    if (key.startsWith('DTSTART'))  ev.start = parseDate(key, val);
    if (key.startsWith('DTEND'))    ev.end   = parseDate(key, val);
    if (key.startsWith('DURATION') && ev.start && !ev.end) ev.end = addDuration(ev.start, val);
  }
  return events;
}

function parseDate(key, val) {
  if (key.includes('VALUE=DATE') || /^\d{8}$/.test(val))
    return new Date(+val.slice(0,4), +val.slice(4,6)-1, +val.slice(6,8));
  const d = val.replace(/[TZ]/g,'');
  const y=+d.slice(0,4), mo=+d.slice(4,6)-1, dy=+d.slice(6,8);
  const h=d.length>=10?+d.slice(8,10):0, mi=d.length>=12?+d.slice(10,12):0, s=d.length>=14?+d.slice(12,14):0;
  if (val.endsWith('Z')) return new Date(Date.UTC(y,mo,dy,h,mi,s));
  return new Date(y,mo,dy,h,mi,s);
}

function addDuration(start, dur) {
  const days=+(dur.match(/(\d+)D/)||[0,0])[1];
  const hrs =+(dur.match(/(\d+)H/)||[0,0])[1];
  const mins=+(dur.match(/(\d+)M/)||[0,0])[1];
  return new Date(start.getTime() + days*86400000 + hrs*3600000 + mins*60000);
}

async function loadAll() {
  setStatus('Loading calendars…');
  try {
    const url = GOOGLE_SCRIPT_URL + '?action=feeds&token=' + encodeURIComponent(SCRIPT_TOKEN);
    const resp = await fetch(url, { signal: AbortSignal.timeout(20000) });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();

    if (data.status !== 'ok') throw new Error(data.message || 'Feed error');

    allEvents = [];
    const failed = [];
    const feedNames = FEED_NAMES;
    for (const name of feedNames) {
      const slots = data.feeds[name];
      if (slots && slots.length > 0) {
        // Convert {start, end} string pairs to Date objects
        for (const slot of slots) {
          const s = parseICSDate(slot.start);
          const e = parseICSDate(slot.end || slot.start);
          if (s) allEvents.push({ start: s, end: e || s });
        }
      } else if (!slots || slots.length === 0) {
        if (data.errors && data.errors[name]) failed.push(name);
      }
    }

    loading = false;
    const loaded = FEED_NAMES.filter(n => data.feeds[n] && !(data.errors && data.errors[n]));
    const failedNames = FEED_NAMES.filter(n => !data.feeds[n] || (data.errors && data.errors[n]));
    if (failedNames.length === 0) {
      setStatus('✓ All calendars loaded: ' + loaded.map(n => FEED_LABELS[n]).join(', '));
    } else if (loaded.length > 0) {
      setStatus('Loaded: ' + loaded.map(n => FEED_LABELS[n]).join(', ') + ' — Failed: ' + failedNames.map(n => FEED_LABELS[n]).join(', '), true);
    } else {
      setStatus('⚠ Could not load calendars', true);
    }

  } catch(err) {
    loading = false;
    setStatus('⚠ Could not load calendars — ' + err.message, true);
    console.warn('loadAll error:', err);
  }
  renderGrid();
}


// ── BUSY CHECK ────────────────────────────────────────────────────────────
function slotStatus(date, startMins) {
  if (isSchoolDay(date) && startMins >= SCHOOL_START && startMins < SCHOOL_END) return 'busy';
  const s = new Date(date); s.setHours(Math.floor(startMins/60), startMins%60, 0, 0);
  const e = new Date(date); e.setHours(Math.floor((startMins+30)/60), (startMins+30)%60, 0, 0);
  const busy = allEvents.some(ev => ev.start && ev.end && ev.start < e && ev.end > s);
  return busy ? 'busy' : 'available';
}

function getMaxDuration(date, startMins) {
  let maxMins = 30;
  for (let m = startMins + 30; m < MINS_END; m += 30) {
    if (slotStatus(date, m) !== 'available') break;
    maxMins += 30;
  }
  return maxMins;
}

// ── HELPERS ───────────────────────────────────────────────────────────────
function getWeekStart() {
  const d = new Date();
  d.setDate(d.getDate() + weekOffset * 7);
  d.setHours(0,0,0,0);
  return d;
}

const DAYS  = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS_LONG   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function fmtSlot(mins) {
  const h  = Math.floor(mins / 60);
  const m  = mins % 60;
  const ap = h < 12 ? 'am' : 'pm';
  const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
  return `${h12}:${m === 0 ? '00' : '30'}${ap}`;
}

function fmtWeekRange(start, numDays) {
  const end = new Date(start); end.setDate(end.getDate() + (numDays - 1));
  return `${MONTHS[start.getMonth()]} ${start.getDate()} \u2013 ${MONTHS[end.getMonth()]} ${end.getDate()}, ${end.getFullYear()}`;
}

// ── RENDER ────────────────────────────────────────────────────────────────
function isMobileWidth() { return window.innerWidth < 768; }

function renderGrid() {
  const numDays = isMobileWidth() ? 7 : 14;
  const grid  = document.getElementById('calGrid');
  const start = getWeekStart();
  const now   = new Date();
  document.getElementById('weekLabel').textContent = fmtWeekRange(start, numDays);

  // Set grid columns dynamically
  document.getElementById('calGrid').style.gridTemplateColumns = `52px repeat(${numDays}, 1fr)`;

  let html = `<div class="col-header corner"></div>`;
  for (let i = 0; i < numDays; i++) {
    const d = new Date(start); d.setDate(d.getDate() + i);
    const today = d.toDateString() === now.toDateString();
    const dow = d.getDay();
    const dayName = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dow];
    html += `<div class="col-header${today ? ' today' : ''}">${dayName}<br>${MONTHS[d.getMonth()]} ${d.getDate()}</div>`;
  }

  for (let mins = MINS_START; mins < MINS_END; mins += 30) {
    const isHalf = mins % 60 !== 0;
    html += `<div class="time-label${isHalf ? ' half' : ''}">${fmtSlot(mins)}</div>`;
    for (let i = 0; i < numDays; i++) {
      const d = new Date(start); d.setDate(d.getDate() + i);
      const slot = new Date(d); slot.setHours(Math.floor(mins/60), mins%60, 0, 0);
      const buffer = new Date(now.getTime() + 24 * 60 * 60 * 1000);
      const past = slot < buffer;

      let cls = 'cell' + (isHalf ? ' half-hour' : '');
      let click = '';
      let st = '';

      if (loading)  { cls += ' loading'; }
      else if (past){ cls += ' past'; }
      else {
        st = slotStatus(d, mins);
        cls += ' ' + st;
        if (st === 'available') click = `data-date="${d.toISOString()}" data-mins="${mins}" data-day="${i}" data-time="${fmtSlot(mins)}"`;
      }
      const dow2 = d.getDay();
      if (st === 'available') {
        html += `<button class="${cls}" ${click} aria-label="Schedule ${fmtSlot(mins)}"></button>`;
      } else {
        html += `<div class="${cls}"></div>`;
      }
    }
  }
  grid.innerHTML = html;
}

// ── NAV ───────────────────────────────────────────────────────────────────
function changeWeek(delta) { weekOffset += delta; renderGrid(); }
function goToToday() { weekOffset = 0; renderGrid(); }


// ── DRAG-TO-SELECT ─────────────────────────────────────────────────────────
let dragState = null;    // { date, dayIdx, startMins, endMins }

function cellFromEl(el) {
  const c = el && el.closest('button[data-date]');
  if (!c) return null;
  return { el: c, date: c.dataset.date, dayIdx: parseInt(c.dataset.day), mins: parseInt(c.dataset.mins) };
}

function startDrag(cell) {
  dragState = { date: cell.date, dayIdx: cell.dayIdx, startMins: cell.mins, endMins: cell.mins };
  updateSelection();
}

function extendDrag(cell) {
  if (!dragState || cell.dayIdx !== dragState.dayIdx) return;
  dragState.endMins = cell.mins;
  updateSelection();
}

function updateSelection() {
  document.querySelectorAll('.cell.selecting').forEach(el => el.classList.remove('selecting'));
  if (!dragState) return;
  const lo = Math.min(dragState.startMins, dragState.endMins);
  const hi = Math.max(dragState.startMins, dragState.endMins);
  document.querySelectorAll(`button[data-day="${dragState.dayIdx}"]`).forEach(el => {
    const m = parseInt(el.dataset.mins);
    if (m >= lo && m <= hi) el.classList.add('selecting');
  });
}

function commitDrag() {
  if (!dragState) return;
  const lo = Math.min(dragState.startMins, dragState.endMins);
  const hi = Math.max(dragState.startMins, dragState.endMins);
  const selectedDur = hi - lo + 30;
  document.querySelectorAll('.cell.selecting').forEach(el => el.classList.remove('selecting'));
  const maxAvail = getMaxDuration(new Date(dragState.date), lo);
  openModal(dragState.date, lo, maxAvail, selectedDur);
  dragState = null;
}

function cancelDrag() {
  document.querySelectorAll('.cell.selecting').forEach(el => el.classList.remove('selecting'));
  dragState = null;
  touchPending = null;
}

const grid = document.getElementById('calGrid');

// ── DESKTOP (mouse) ──────────────────────────────────────────────────────
grid.addEventListener('mousedown', e => {
  const cell = cellFromEl(e.target);
  if (!cell) return;
  e.preventDefault();
  startDrag(cell);
});

document.addEventListener('mousemove', e => {
  if (!dragState) return;
  const cell = cellFromEl(e.target);
  if (cell) extendDrag(cell);
});

document.addEventListener('mouseup', e => {
  if (!dragState) return;
  commitDrag();
});

// ── MOBILE (two-tap selection) ───────────────────────────────────────────
let mobileTapState = null; // { date, dayIdx, startMins } after first tap
let touchStartPos  = null;
let _lastStatus    = '';

function clearMobileTap() {
  document.querySelectorAll('.tap-start').forEach(el => el.classList.remove('tap-start'));
  mobileTapState = null;
  if (_lastStatus) setStatus(_lastStatus);
}

function handleMobileTap(cell) {
  if (!mobileTapState) {
    // First tap — mark start
    _lastStatus = document.getElementById('statusBar').textContent;
    mobileTapState = { date: cell.date, dayIdx: cell.dayIdx, startMins: cell.mins };
    cell.el.classList.add('tap-start');
    setStatus('Tap the end time · tap elsewhere to cancel');
  } else if (cell.date !== mobileTapState.date || cell.dayIdx !== mobileTapState.dayIdx) {
    // Different column — reset to new start
    clearMobileTap();
    _lastStatus = document.getElementById('statusBar').textContent;
    mobileTapState = { date: cell.date, dayIdx: cell.dayIdx, startMins: cell.mins };
    cell.el.classList.add('tap-start');
    setStatus('Tap the end time · tap elsewhere to cancel');
  } else {
    // Second tap same column — commit
    const lo = Math.min(mobileTapState.startMins, cell.mins);
    const hi = Math.max(mobileTapState.startMins, cell.mins);
    const selectedDur = hi - lo + 30;
    const maxAvail = getMaxDuration(new Date(cell.date), lo);
    clearMobileTap();
    openModal(cell.date, lo, maxAvail, selectedDur);
  }
}

grid.addEventListener('touchstart', e => {
  const touch = e.touches[0];
  touchStartPos = { x: touch.clientX, y: touch.clientY };
}, { passive: true });

grid.addEventListener('touchend', e => {
  if (!touchStartPos) return;
  const touch = e.changedTouches[0];
  const dx = Math.abs(touch.clientX - touchStartPos.x);
  const dy = Math.abs(touch.clientY - touchStartPos.y);
  touchStartPos = null;
  if (dx > 12 || dy > 12) return; // was a scroll — ignore

  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  const cell = cellFromEl(el);
  if (!cell) { clearMobileTap(); return; }

  e.preventDefault(); // suppress ghost click
  handleMobileTap(cell);
}, { passive: false });

document.addEventListener('keydown', e => { if (e.key === 'Escape') cancelDrag(); });


// ── MAPS / LOCATION ────────────────────────────────────────────────────────


// ── MODAL ─────────────────────────────────────────────────────────────────
function openModal(dateISO, mins, maxMins, presetMins) {
  const d = new Date(dateISO); d.setHours(Math.floor(mins/60), mins%60, 0, 0);
  const durMinsSelected = presetMins || 60;
  selectedSlot = { date: d, mins, durMins: durMinsSelected };

  // Show time range if multi-slot selected
  const dateLine = `${DAYS_LONG[d.getDay()]}, ${MONTHS_LONG[d.getMonth()]} ${d.getDate()}`;
  if (presetMins && presetMins > 30) {
    const endMins = mins + presetMins;
    document.getElementById('slotDisplay').innerHTML =
      `${dateLine}<br>${fmtSlot(mins)} to ${fmtSlot(endMins)}`;
  } else {
    document.getElementById('slotDisplay').innerHTML =
      `${dateLine}<br>${fmtSlot(mins)}`;
  }



  document.getElementById('overlay').classList.add('open');
  document.getElementById('locationField').value = '';
  document.querySelectorAll('.field input').forEach(i => i.classList.remove('has-value'));
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  selectedSlot = null;
}

// Track filled state on all modal text inputs
document.querySelectorAll('.field input').forEach(input => {
  const update = () => input.classList.toggle('has-value', input.value.trim().length > 0);
  input.addEventListener('input', update);
  input.addEventListener('change', update);
});


function handleOverlayClick(e) { if (e.target.id === 'overlay') closeModal(); }

// ── DOWNLOAD ICS ──────────────────────────────────────────────────────────
function buildICS(name, start, end, note) {
  const fmt = d => d.toISOString().replace(/[-:.]/g,'').slice(0,-1) + 'Z';
  const uid = 'kooi-' + Date.now() + '@kooifamily';
  return [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Kooi Family Scheduler//EN','METHOD:REQUEST',
    'BEGIN:VEVENT',
    'UID:' + uid,
    'DTSTART:' + fmt(start),
    'DTEND:' + fmt(end),
    'SUMMARY:Get-together \u2014 Kooi Family',
    'DESCRIPTION:Requested by ' + name + (note ? '\\n\\n' + note : ''),
    'STATUS:TENTATIVE','END:VEVENT','END:VCALENDAR',
  ].join('\r\n');
}

function downloadInvite() {
  const name       = document.getElementById('guestName').value.trim() || 'Guest';
  const guestEmail = document.getElementById('guestEmail').value.trim().toLowerCase();
  const durMins    = selectedSlot.durMins || 60;
  const note       = document.getElementById('noteField').value.trim();
  const start      = new Date(selectedSlot.date);
  const end        = new Date(start.getTime() + durMins * 60000);
  const ics        = buildICS(name, start, end, note);

  // Validate email — must be present, look like an email, and not be the placeholder
  const emailValid = guestEmail &&
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(guestEmail) &&
    guestEmail !== 'homer@simpsons.com';
  if (!emailValid) {
    const emailInput = document.getElementById('guestEmail');
    emailInput.style.borderColor = 'var(--orange)';
    emailInput.focus();
    emailInput.placeholder = 'Please enter your real email address';
    setTimeout(() => {
      emailInput.style.borderColor = '';
      emailInput.placeholder = 'e.g. Homer@simpsons.com';
    }, 3000);
    return;
  }

  if (!GOOGLE_SCRIPT_URL || !GOOGLE_SCRIPT_URL.startsWith('https://')) {
    alert('Email service not configured.');
    closeModal();
    return;
  }

  const slotText  = document.getElementById('slotDisplay').innerText.replace('\n', ' ');
  const location  = document.getElementById('locationField').value.trim();
  const hasEmail  = true; // already validated above
  const payload = hasEmail ? {
    action:        'create_event',
    token:         SCRIPT_TOKEN,
    guest_name:    name,
    guest_email:   guestEmail,
    kooi_email:    KOOI_EMAIL,
    start_iso:     selectedSlot.date.toISOString(),
    duration_mins: durMins,
    note:          note || '',
    location:      location,
  } : {
    token:         SCRIPT_TOKEN,
    guest_name:    name,
    guest_email:   '',
    kooi_email:    KOOI_EMAIL,
    event_time:    slotText,
    duration_mins: durMins,
    note:          note || '',
    location:      location,
    ics_content:   ics,
  };

  fetch(GOOGLE_SCRIPT_URL, {
    method:  'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body:    JSON.stringify(payload),
  }).then(async resp => {
    let result;
    try { result = await resp.json(); } catch(e) { result = null; }
    if (!resp.ok || !result || result.status !== 'ok') {
      console.error('Invite failed:', result);
      alert('There was a problem sending the invite: ' + (result && result.message ? result.message : 'unknown error') + '\n\nPlease try again or contact ' + KOOI_EMAIL + ' directly.');
      return;
    }
    alert(hasEmail
      ? 'Calendar invite sent! Both parties will receive a Google Calendar invite.'
      : 'Invite sent to ' + KOOI_EMAIL + '.');
  }).catch(err => {
    console.warn('Send error:', err);
    alert('There was a problem sending the invite. Please try again.');
  });

  closeModal();
}

// ── STATUS ────────────────────────────────────────────────────────────────
function setStatus(msg, isError=false) {
  const el = document.getElementById('statusBar');
  el.textContent = msg;
  el.className = 'status-bar' + (isError ? ' error' : '');
}

// Re-render on resize so mobile/desktop switch works
let _resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(renderGrid, 150);
});

// ── INIT ──────────────────────────────────────────────────────────────────
renderGrid();
loadAll();
</script>
